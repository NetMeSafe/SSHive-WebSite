<%
if (s.forceSsl) {
%>
    server {

        listen       80;

        server_name  <%-s.publicDomain%>;

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }

        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        location / {
            # Canonical host is the apex: collapse www + http into one hop.
            if ($host = "www.sshive.app") {
                return 301 https://sshive.app$request_uri;
            }
            return 301 https://$host$request_uri;
        }
    }
<%
}
%>


server {

    <%
    if (!s.forceSsl) {
    %>
        listen       80;
    <%
    }
    if (s.hasSsl) {
    %>
        listen              443 ssl;
        http2               on;
        ssl_certificate     <%-s.crtPath%>;
        ssl_certificate_key <%-s.keyPath%>;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    <%
    }
    if (s.logAccessPath) {
    %>
        access_log <%-s.logAccessPath%>;
    <%
    }
    %>

        client_max_body_size 500m;

        server_name  <%-s.publicDomain%>;

        # www → apex 301: the site must live on exactly one host for SEO
        # (canonical/sitemap/GSC all use https://sshive.app).
        if ($host = "www.sshive.app") {
            return 301 https://sshive.app$request_uri;
        }

        # 127.0.0.11 is DNS set up by Docker, see:
        # https://docs.docker.com/engine/userguide/networking/configure-dns/
        # https://github.com/moby/moby/issues/20026
        resolver 127.0.0.11 valid=10s;
        # IMPORTANT!! If you are here from an old thread to set a custom port, you do not need to modify this port manually here!!
        # Simply change the Container HTTP Port from the dashboard HTTP panel
        set $upstream http://<%-s.localDomain%>:<%-s.containerHttpPort%>;

        location / {


    <%
    if (s.redirectToPath) {
    %>
        return 301 <%-s.redirectToPath%>$request_uri;
    <%
    } else {
    %>

            <%
            if (s.httpBasicAuthPath) {
            %>
                auth_basic           "Restricted Access";
                auth_basic_user_file <%-s.httpBasicAuthPath%>;
            <%
            }
            %>

                proxy_pass $upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

            <%
            if (s.websocketSupport) {
            %>
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_http_version 1.1;
            <%
            }
            %>


    <%
    }
    %>

        }

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }

        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        # Domain ownership proof for the official MCP Registry. Served here and
        # not by Next.js on purpose: Next refuses to serve dot-prefixed files
        # from public/, and its middleware never runs for a path whose first
        # segment starts with a dot, whatever the matcher says. nginx is the
        # only layer that reliably sees this exact path.
        #
        # Public half of an Ed25519 keypair; the private half stays on the
        # maintainer's machine (~/.mcp-registry/sshive-ed25519.key, 0600) and
        # signs the registry challenge during `mcp-publisher login http`.
        location = /.well-known/mcp-registry-auth {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600" always;
            return 200 "v=MCPv1; k=ed25519; p=OLMd1NWl/dU1Iz1WA8WJ/LKBkbUX/aUIjgl9aVB8+U8=\n";
        }

        error_page 502 /captain_502_custom_error_page.html;
        location = /captain_502_custom_error_page.html {
                root <%-s.customErrorPagesDirectory%>;
                internal;
        }
}
